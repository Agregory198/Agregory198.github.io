title: Alex Gregory Portfolio
description: Quantitative modeling, ML, and data systems

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "air"

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme

include:
  - _pages

defaults:
  - scope:
      path: ""
    values:
      layout: single

  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
