title: Alex Gregory Portfolio
description: Quantitative modeling, ML, and data systems

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "air"

plugins:
  - jekyll-include-cache

defaults:
  - scope:
      path: ""
    values:
      layout: single

  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true

header_pages:
  - _pages/index.md
  - _pages/projects.md
  - _pages/blog.md
  - _pages/about.md
