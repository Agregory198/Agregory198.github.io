title: Alex Gregory Portfolio
description: Quantitative modeling, ML, and data systems

author:
  name: Alex Gregory
  avatar: "/assets/images/profile.jpg"
  bio: "Quantitative modeling, machine learning, and computational systems."
  location: "New York"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/Agregory198"

    - label: "Linkedin"
      icon: "fab fa-linkedin"
      link: "https://linkedin.com"
      url: "https://www.linkedin.com/in/alex-gregory-33316590"

remote_theme: "mmistakes/minimal-mistakes"
minimal_mistakes_skin: "air"

collections:
  projects:
    output: true
    permalink: /projects/:path/

plugins:
  - jekyll-include-cache
  - jekyll-remote-theme

include:
  - _pages

defaults:
  - scope:
      path: ""
    values:
      layout: single

  - scope:
      path: ""
      type: posts
    values:
      layout: single
      author_profile: true
